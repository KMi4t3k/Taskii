<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Calendar Base Card -->
  <rect x="80" y="90" width="352" height="342" rx="36" fill="#ffffff" fill-opacity="0.96" />
  
  <!-- Calendar Header Bar -->
  <path d="M 80 126 C 80 106.1 96.1 90 116 90 L 396 90 C 415.9 90 432 106.1 432 126 L 432 166 L 80 166 Z" fill="#2563eb" />
  
  <!-- Calendar Rings / Binder Loops -->
  <rect x="150" y="66" width="28" height="48" rx="14" fill="#cbd5e1" stroke="#ffffff" stroke-width="4" />
  <rect x="334" y="66" width="28" height="48" rx="14" fill="#cbd5e1" stroke="#ffffff" stroke-width="4" />
  
  <!-- Time Block 1 (Morning Flow) -->
  <rect x="114" y="196" width="130" height="52" rx="12" fill="url(#blockGrad)" />
  <circle cx="134" cy="222" r="6" fill="#ffffff" />
  <rect x="150" y="217" width="76" height="10" rx="5" fill="#ffffff" />
  
  <!-- Time Block 2 (Deep Work) -->
  <rect x="114" y="262" width="284" height="64" rx="14" fill="#6366f1" />
  <circle cx="138" cy="294" r="7" fill="#ffffff" />
  <rect x="156" y="287" width="140" height="14" rx="7" fill="#ffffff" />
  
  <!-- Time Block 3 (Checkmark / Completed) -->
  <rect x="114" y="340" width="190" height="54" rx="12" fill="#10b981" />
  <path d="M 130 367 L 138 375 L 152 359" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="166" y="362" width="118" height="10" rx="5" fill="#ffffff" />
  
  <!-- Stopwatch / Clock Accent Badge on Bottom Right -->
  <circle cx="390" cy="380" r="54" fill="#f59e0b" stroke="#ffffff" stroke-width="8" />
  <circle cx="390" cy="380" r="42" fill="#ffffff" />
  <!-- Clock Hands -->
  <line x1="390" y1="380" x2="390" y2="354" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
  <line x1="390" y1="380" x2="408" y2="380" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
  <circle cx="390" cy="380" r="4" fill="#0f172a" />
</svg>
